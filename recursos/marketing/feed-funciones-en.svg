<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1428"/>
      <stop offset="0.55" stop-color="#020617"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="flag"><rect x="400" y="48" width="64" height="44" rx="8"/></clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="150" r="150" fill="url(#glowA)"/>
  <circle cx="120" cy="900" r="160" fill="url(#glowR)"/>

  <!-- brand -->
  <g clip-path="url(#flag)">

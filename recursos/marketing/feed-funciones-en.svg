    <g transform="scale(2.1) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </g>
  </g>
  <text x="880" y="878" text-anchor="middle" font-size="26" font-weight="700" fill="#e2e8f0">Emergency</text>

  <!-- CTA -->
  <rect x="310" y="922" width="460" height="104" rx="52" fill="url(#cta)"/>
  <text x="540" y="990" text-anchor="middle" font-size="50" font-weight="800" fill="#ffffff">ayudacol.org</text>
  <text x="540" y="1058" text-anchor="middle" font-size="23" fill="#64748b">Help Colombia from abroad · Spanish &amp; English · Share it</text>

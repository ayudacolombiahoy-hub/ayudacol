  <rect x="422" y="106" width="236" height="48" rx="24" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
  <circle cx="464" cy="130" r="6.5" fill="#4ade80"/>
  <text x="484" y="139" text-anchor="start" font-size="25" font-weight="700" fill="#4ade80" letter-spacing="1">NOW LIVE</text>


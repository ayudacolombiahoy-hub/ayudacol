<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1428"/>
      <stop offset="0.55" stop-color="#020617"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- focos decorativos (glow) -->
  <circle cx="150" cy="470" r="120" fill="url(#glowR)"/>
  <circle cx="930" cy="640" r="120" fill="url(#glowA)"/>
  <circle cx="880" cy="1180" r="130" fill="url(#glowR)"/>
  <circle cx="180" cy="1300" r="120" fill="url(#glowA)"/>
  <circle cx="150" cy="470" r="9" fill="#ef4444"/>
  <circle cx="930" cy="640" r="9" fill="#f59e0b"/>
  <circle cx="880" cy="1180" r="9" fill="#ef4444"/>
  <circle cx="180" cy="1300" r="9" fill="#f59e0b"/>

  <!-- marca -->
  <text x="540" y="250" text-anchor="middle" font-size="46" font-weight="800" fill="#f8fafc">🇨🇴 AyudaCol</text>
  <g>
    <circle cx="442" cy="300" r="9" fill="#4ade80"/>
    <text x="460" y="309" text-anchor="start" font-size="30" font-weight="600" fill="#4ade80">datos en vivo</text>
  </g>

  <!-- titular -->
  <text x="540" y="470" text-anchor="middle" font-size="96" font-weight="800" fill="#ffffff">Buscamos</text>
  <text x="540" y="580" text-anchor="middle" font-size="96" font-weight="800" fill="#7dd3fc">voluntarios/as 🙏</text>

  <!-- subtítulo -->
  <text x="540" y="700" text-anchor="middle" font-size="38" fill="#cbd5e1">Ya tengo lista una plataforma que centraliza</text>
  <text x="540" y="750" text-anchor="middle" font-size="38" fill="#cbd5e1">en <tspan font-weight="700" fill="#f8fafc">tiempo real</tspan> las necesidades, acopios y</text>
  <text x="540" y="800" text-anchor="middle" font-size="38" fill="#cbd5e1">servicios de las zonas del terremoto.</text>

  <text x="540" y="900" text-anchor="middle" font-size="40" font-weight="700" fill="#f8fafc">Necesito personas que cada día:</text>

  <!-- bullets -->
  <g font-size="36" fill="#e2e8f0">
    <text x="130" y="1010">✅  Recolecten y confirmen solicitudes</text>
    <text x="130" y="1090">📞  Verifiquen acopios, necesidades y servicios</text>
    <text x="130" y="1170">🗺️  Mantengan los datos vivos, al día</text>
  </g>

  <!-- info -->
  <text x="540" y="1300" text-anchor="middle" font-size="40" font-weight="700" fill="#fcd34d">📍 Todos los departamentos afectados</text>
  <text x="540" y="1352" text-anchor="middle" font-size="34" fill="#94a3b8">Manizales · Pereira · Quindío · Cali · Chocó</text>

  <text x="540" y="1450" text-anchor="middle" font-size="40" fill="#e2e8f0">⏱️ Con <tspan font-weight="800" fill="#ffffff">~1 hora al día</tspan> ya ayudas muchísimo</text>

  <!-- CTA -->
  <rect x="190" y="1560" width="700" height="140" rx="70" fill="url(#cta)"/>
  <text x="540" y="1650" text-anchor="middle" font-size="52" font-weight="800" fill="#ffffff">¿Te sumas? Escríbeme 💬</text>

  <text x="540" y="1770" text-anchor="middle" font-size="30" fill="#64748b">Para las familias que más lo necesitan.</text>
</svg>

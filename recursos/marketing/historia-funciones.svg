<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1428"/>
      <stop offset="0.55" stop-color="#020617"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ef4444" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="flag"><rect x="330" y="176" width="70" height="48" rx="9"/></clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <circle cx="985" cy="330" r="150" fill="url(#glowA)"/>
  <circle cx="90" cy="640" r="140" fill="url(#glowR)"/>
  <circle cx="990" cy="1500" r="160" fill="url(#glowR)"/>
  <circle cx="95" cy="1700" r="150" fill="url(#glowA)"/>
  <circle cx="985" cy="330" r="7" fill="#f59e0b"/>
  <circle cx="990" cy="1500" r="7" fill="#ef4444"/>

  <!-- marca -->
  <g clip-path="url(#flag)">
    <rect x="330" y="176" width="70" height="24" fill="#FCD116"/>
    <rect x="330" y="200" width="70" height="12" fill="#003893"/>
    <rect x="330" y="212" width="70" height="12" fill="#CE1126"/>
  </g>
  <text x="414" y="216" text-anchor="start" font-size="54" font-weight="800" fill="#f8fafc">AyudaCol</text>

  <!-- badge -->
  <rect x="392" y="258" width="296" height="54" rx="27" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
  <circle cx="432" cy="285" r="7" fill="#4ade80"/>
  <text x="454" y="295" text-anchor="start" font-size="28" font-weight="700" fill="#4ade80" letter-spacing="1">YA EN LÍNEA</text>

  <!-- titular -->
  <text x="540" y="402" text-anchor="middle" font-size="70" font-weight="800" fill="#ffffff">Todo para ayudar,</text>
  <text x="540" y="482" text-anchor="middle" font-size="70" font-weight="800" fill="#7dd3fc">en un solo lugar</text>
  <text x="540" y="542" text-anchor="middle" font-size="30" fill="#cbd5e1">Información verificada, en tiempo real, por municipio</text>

  <!-- 1 Necesidades -->
  <g transform="translate(154 632)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#3b82f6"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="22 4 12 14.01 9 11.01" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="232" y="626" font-size="39" font-weight="700" fill="#f1f5f9">Necesidades verificadas</text>
  <text x="232" y="663" font-size="25" fill="#94a3b8">Solicitudes reales por municipio</text>

  <!-- 2 Mapa -->
  <g transform="translate(154 729)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#38bdf8"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="10" r="3" fill="none" stroke="#fff" stroke-width="2.3"/>
    </g>
  </g>
  <text x="232" y="723" font-size="39" font-weight="700" fill="#f1f5f9">Mapa interactivo en vivo</text>
  <text x="232" y="760" font-size="25" fill="#94a3b8">Focos por departamento</text>

  <!-- 3 Acopios -->
  <g transform="translate(154 826)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#f59e0b"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M16.5 9.4l-9-5.19" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="22.08" x2="12" y2="12" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="232" y="820" font-size="39" font-weight="700" fill="#f1f5f9">Centros de acopio</text>
  <text x="232" y="857" font-size="25" fill="#94a3b8">Dónde llevar donaciones</text>

  <!-- 4 Voluntariado -->
  <g transform="translate(154 923)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#22c55e"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="7" r="4" fill="none" stroke="#fff" stroke-width="2.3"/>
    </g>
  </g>
  <text x="232" y="917" font-size="39" font-weight="700" fill="#f1f5f9">Voluntariado</text>
  <text x="232" y="954" font-size="25" fill="#94a3b8">Ofrece o pide ayuda</text>

  <!-- 5 Albergues -->
  <g transform="translate(154 1020)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#a78bfa"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="232" y="1014" font-size="39" font-weight="700" fill="#f1f5f9">Albergues con cupos</text>
  <text x="232" y="1051" font-size="25" fill="#94a3b8">Espacios disponibles</text>

  <!-- 6 Desaparecidos -->
  <g transform="translate(154 1117)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#fb7185"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <circle cx="11" cy="11" r="8" fill="none" stroke="#fff" stroke-width="2.3"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
    </g>
  </g>
  <text x="232" y="1111" font-size="39" font-weight="700" fill="#f1f5f9">Personas desaparecidas</text>
  <text x="232" y="1148" font-size="25" fill="#94a3b8">Reporta y ayuda a buscar</text>

  <!-- 7 Mascotas (NUEVO) -->
  <g transform="translate(154 1214)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#14b8a6"/>
    <g fill="#fff">
      <ellipse cx="-13" cy="-6" rx="5" ry="6.5"/>
      <ellipse cx="-4.5" cy="-13" rx="5" ry="7"/>
      <ellipse cx="5.5" cy="-13" rx="5" ry="7"/>
      <ellipse cx="14" cy="-6" rx="5" ry="6.5"/>
      <ellipse cx="0" cy="9" rx="13" ry="10.5"/>
    </g>
  </g>
  <text x="232" y="1208" font-size="39" font-weight="700" fill="#f1f5f9">Mascotas perdidas</text>
  <text x="232" y="1245" font-size="25" fill="#94a3b8">Reúne familias con sus animales</text>

  <!-- 8 Donaciones -->
  <g transform="translate(154 1311)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#ef4444"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="232" y="1305" font-size="39" font-weight="700" fill="#f1f5f9">Donaciones verificadas</text>
  <text x="232" y="1342" font-size="25" fill="#94a3b8">Campañas confiables + exterior</text>

  <!-- 9 Emergencia -->
  <g transform="translate(154 1408)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#6366f1"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="232" y="1402" font-size="39" font-weight="700" fill="#f1f5f9">Líneas de emergencia</text>
  <text x="232" y="1439" font-size="25" fill="#94a3b8">Directorio 123 · 132 · 144</text>

  <!-- extra -->
  <text x="540" y="1502" text-anchor="middle" font-size="27" fill="#64748b">+ Novedades · Alertas por municipio · Estadísticas</text>

  <!-- CTA -->
  <text x="540" y="1552" text-anchor="middle" font-size="29" fill="#94a3b8">Entra ahora y compártela</text>
  <rect x="270" y="1574" width="540" height="116" rx="58" fill="url(#cta)"/>
  <text x="540" y="1649" text-anchor="middle" font-size="56" font-weight="800" fill="#ffffff">ayudacol.org</text>

  <!-- footer -->
  <text x="540" y="1758" text-anchor="middle" font-size="29" fill="#64748b">Español  ·  English  ·  Gratis y sin registro</text>
  <text x="540" y="1798" text-anchor="middle" font-size="25" fill="#475569">Para las familias afectadas por el terremoto</text>
</svg>

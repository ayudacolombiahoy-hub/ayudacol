<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1428"/>
      <stop offset="0.55" stop-color="#020617"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ef4444" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#f59e0b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <clipPath id="flag"><rect x="322" y="176" width="70" height="48" rx="9"/></clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <circle cx="985" cy="330" r="150" fill="url(#glowA)"/>
  <circle cx="90" cy="640" r="140" fill="url(#glowR)"/>
  <circle cx="990" cy="1500" r="160" fill="url(#glowR)"/>
  <circle cx="95" cy="1700" r="150" fill="url(#glowA)"/>
  <circle cx="985" cy="330" r="7" fill="#f59e0b"/>
  <circle cx="990" cy="1500" r="7" fill="#ef4444"/>

  <!-- brand -->
  <g clip-path="url(#flag)">
    <rect x="322" y="176" width="70" height="24" fill="#FCD116"/>
    <rect x="322" y="200" width="70" height="12" fill="#003893"/>
    <rect x="322" y="212" width="70" height="12" fill="#CE1126"/>
  </g>
  <text x="406" y="216" text-anchor="start" font-size="54" font-weight="800" fill="#f8fafc">AyudaCol</text>

  <!-- badge -->
  <rect x="410" y="258" width="260" height="54" rx="27" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
  <circle cx="450" cy="285" r="7" fill="#4ade80"/>
  <text x="472" y="295" text-anchor="start" font-size="28" font-weight="700" fill="#4ade80" letter-spacing="1">NOW LIVE</text>

  <!-- headline -->
  <text x="540" y="402" text-anchor="middle" font-size="70" font-weight="800" fill="#ffffff">Everything to help,</text>
  <text x="540" y="482" text-anchor="middle" font-size="70" font-weight="800" fill="#7dd3fc">all in one place</text>
  <text x="540" y="542" text-anchor="middle" font-size="31" fill="#cbd5e1">Verified, real-time info — town by town</text>

  <!-- 1 Needs -->
  <g transform="translate(154 632)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#3b82f6"/>
    <g transform="scale(1.85) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </g>
  </g>
  <text x="232" y="626" font-size="41" font-weight="700" fill="#f1f5f9">Verified needs</text>
  <text x="232" y="663" font-size="26" fill="#94a3b8">Real requests, town by town</text>

  <!-- 2 Map -->
  <g transform="translate(154 729)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#38bdf8"/>
    <g transform="scale(1.85) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>

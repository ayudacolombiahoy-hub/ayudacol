  <g transform="translate(154 1214)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#14b8a6"/>
    <g fill="#fff">
      <ellipse cx="-13" cy="-6" rx="5" ry="6.5"/>
      <ellipse cx="-4.5" cy="-13" rx="5" ry="7"/>
      <ellipse cx="5.5" cy="-13" rx="5" ry="7"/>
      <ellipse cx="14" cy="-6" rx="5" ry="6.5"/>
      <ellipse cx="0" cy="9" rx="13" ry="10.5"/>
    </g>
  </g>
  <text x="232" y="1208" font-size="41" font-weight="700" fill="#f1f5f9">Lost &amp; found pets</text>
  <text x="232" y="1245" font-size="26" fill="#94a3b8">Reunite pets with families</text>

  <!-- 8 Donations -->
  <g transform="translate(154 1311)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#ef4444"/>
    <g transform="scale(1.85) translate(-12 -12)">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="232" y="1305" font-size="41" font-weight="700" fill="#f1f5f9">Verified donations</text>
  <text x="232" y="1342" font-size="26" fill="#94a3b8">Trusted campaigns + from abroad</text>

  <!-- 9 Emergency -->
  <g transform="translate(154 1408)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#6366f1"/>
    <g transform="scale(1.85) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </g>
  </g>
  <text x="232" y="1402" font-size="41" font-weight="700" fill="#f1f5f9">Emergency lines</text>
  <text x="232" y="1439" font-size="26" fill="#94a3b8">Directory 123 · 132 · 144</text>

  <!-- extra -->
  <text x="540" y="1502" text-anchor="middle" font-size="27" fill="#64748b">+ Updates · Local alerts · Statistics</text>

  <!-- CTA -->
  <text x="540" y="1552" text-anchor="middle" font-size="29" fill="#94a3b8">Visit now and share it</text>
  <rect x="270" y="1574" width="540" height="116" rx="58" fill="url(#cta)"/>
  <text x="540" y="1649" text-anchor="middle" font-size="56" font-weight="800" fill="#ffffff">ayudacol.org</text>

  <!-- footer -->
  <text x="540" y="1758" text-anchor="middle" font-size="30" fill="#64748b">Spanish · English · Free, no sign-up</text>
  <text x="540" y="1798" text-anchor="middle" font-size="26" fill="#475569">For the families affected by the earthquake</text>
</svg>

  <g transform="translate(154 923)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#22c55e"/>
    <g transform="scale(1.85) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </g>
  </g>
  <text x="232" y="917" font-size="41" font-weight="700" fill="#f1f5f9">Volunteering</text>
  <text x="232" y="954" font-size="26" fill="#94a3b8">Offer or ask for help</text>

  <!-- 5 Shelters -->
  <g transform="translate(154 1020)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#a78bfa"/>
    <g transform="scale(1.85) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </g>
  </g>
  <text x="232" y="1014" font-size="41" font-weight="700" fill="#f1f5f9">Shelters with space</text>
  <text x="232" y="1051" font-size="26" fill="#94a3b8">Available spots</text>

  <!-- 6 Missing persons -->
  <g transform="translate(154 1117)">
    <rect x="-44" y="-44" width="88" height="88" rx="24" fill="#fb7185"/>
    <g transform="scale(1.85) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </g>
  </g>
  <text x="232" y="1111" font-size="41" font-weight="700" fill="#f1f5f9">Missing persons</text>
  <text x="232" y="1148" font-size="26" fill="#94a3b8">Report &amp; help search</text>

